<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
  <!-- skoop-live-runtime -->
  <script src="./skoop-live.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url('https://skoop-signage-storage-v2-staging.s3.amazonaws.com/LfucUUAVUFbUBuL_Gs0oBD24KLiDhJ_dtHZvW0Y214s=_skoop_media_8c7ebc57fcfe817e9bff95c727ecff16_912664994.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #00b7af;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        h1 {
            font-size: 8rem;
            margin-bottom: 1rem;
            text-align: center;
            background: linear-gradient(
                to right,
                #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 5s linear infinite;
            background-size: 200% auto;
        }
        p {
            font-size: 2rem;
            color: #6a7071;
            margin-top: 0;
        }
        @keyframes rainbow {
            to {
                background-position: 200% center;
            }
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <p>Welcome to our digital signage display. Stay tuned for more updates.</p>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
